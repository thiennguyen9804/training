spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.shipping_service.event
spring.kafka.consumer.properties.spring.json.type.mapping=com.example.order_service.dto.ShipmentEvent:com.example.shipping_service.event.ShipmentEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=com.example.order_service.dto.ShipmentEvent:com.example.shipping_service.event.ShipmentEvent