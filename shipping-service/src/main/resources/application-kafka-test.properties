# Địa chỉ kết nối chung cho cả nhận và gửi
spring.kafka.bootstrap-servers=localhost:9092

# Cấu hình phía Nhận (Consumer)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.shipping_service.event
spring.kafka.consumer.properties.spring.json.type.mapping=com.example.order_service.dto.ShipmentEvent:com.example.shipping_service.event.ShipmentEvent

# Cấu hình phía Gửi (Producer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Bổ sung dòng này nếu muốn kafkaTemplate trong bài test giả lập gửi đúng header giống order-service
spring.kafka.producer.properties.spring.json.type.mapping=com.example.order_service.dto.ShipmentEvent:com.example.shipping_service.event.ShipmentEvent
