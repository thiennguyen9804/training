spring.application.name=shipping-service
server.port=8082
server.servlet.context-path=/api
spring.datasource.url=jdbc:mysql://localhost:3306/my_db?useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=\
  com.example.order_service.model.dto,\
  com.example.stock_service.dto
spring.kafka.consumer.properties.spring.json.type.mapping=\
  com.example.order_service.model.dto.ShipmentEvent:com.example.shipping_service.event.ShipmentEvent,\
  com.example.stock_service.dto.UpdateShippingDto:com.example.shipping_service.event.UpdateShipmentEvent
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
