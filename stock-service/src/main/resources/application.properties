spring.application.name=stock-service
camel.servlet.base-api=/api
spring.datasource.url=jdbc:mysql://localhost:3306/my_db?useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

camel.main.routes-include-pattern=\
  classpath:camel-config/*.yaml,\
  classpath:camel-rest/*.yaml,\
  classpath:camel-route/*.yaml
