- route:
    routeConfigurationId: "GlobalExceptionHandler"
    from:
      uri: "direct:updateShipping"
      steps:
        - split:
            simple: "${body}"
            steps:
              - setHeader:
                  name: "CamelKafkaKey"
                  simple: "${body.getId()}" # current data type of exchange body's: UpdateShippingDto
              - to: "direct:kafkaShipping"
- route:
    from:
      uri: "direct:kafkaShipping"
      steps:
        - wireTap:
            uri: "direct:messageWireTap"
        - setProperty:
            name: "id"
            simple: "${body.getId()}" # current data type of exchange body's: UpdateShippingDto
        - setProperty:
            name: "oldBody"
            simple: "${body}" # storing the current body
        - marshal: # convert UpdateShippingDto to JSON and store it in body
            json: {} # current data type of exchange body's: JSON (InputStreamCache) of UpdateShippingDto
        - convertBodyTo: "java.lang.String" # convert body to JSON String to save to DB
        - setProperty:
            name: "payload"
            simple: "${body}" # which means put said JSON into payload property
        - setBody:
            simple: "${exchangeProperty.oldBody}" # retrieved archived body, which puts this data type in the body to UpdateShippingDto
        - setHeader:
            name: "CamelSqlRetrieveGeneratedKeys"
            constant: true # help return generated id when insert
        - to:
            uri: "sql:INSERT INTO kafka_outboxes (topic, message_key, payload) VALUES ('update-shipping-topic', :#${exchangeProperty.id}, :#${exchangeProperty.payload})"
        - to:
            uri: "kafka:update-shipping-topic"
            parameters:
              brokers: "localhost:9092"
              keySerializer: "org.apache.kafka.common.serialization.LongSerializer"
              valueSerializer: "org.springframework.kafka.support.serializer.JsonSerializer"
              retryBackoffMs: 1000
              retries: 3
        - to:
            uri: "sql:DELETE FROM kafka_outboxes WHERE id = :#${header.generatedOutboxId}"

- route:
    from:
      uri: "direct:messageWireTap"
      steps:
        - log: "Message ${body}, whose data type is: ${body.getClass()}, will be sent to Kafka Broker"

